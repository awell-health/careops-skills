# Everything in this repository is published to customers. This check fails when a file
# names an internal host, a project id customers don't query, a real BigQuery dataset or a
# customer. See scripts/check-public-safe.mjs for the rules.
name: Public-safe check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that no file names an internal host, project id or customer
        env:
          # One customer name per line. The script never prints it.
          PUBLIC_SAFE_TERMS: ${{ secrets.PUBLIC_SAFE_TERMS }}
        run: node scripts/check-public-safe.mjs
